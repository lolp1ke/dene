# SPDX-License-Identifier: Apache-2.0

[package]
name = "dene"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
include.workspace = true
publish.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[features]
default = [
  "crossterm",
  "derive_more",
  "futurus-util",
  "rustc-hash",
  "tracing",
  "taffy",
  "tokio",
  "toml",
]

crossterm = ["crossterm/event-stream"]
derive_more = [
  "derive_more/debug",
  "derive_more/deref",
  "derive_more/deref_mut",
  "derive_more/add",
  "derive_more/add_assign",
  "derive_more/mul",
  "derive_more/mul_assign",
]
futurus-util = ["futures-util/alloc"]
rustc-hash = ["rustc-hash/std"]
tracing = [
  "tracing-subscriber/env-filter",
  "tracing-subscriber/std",
  "tracing-subscriber/registry",
  "tracing-subscriber/fmt",
  "tracing-subscriber/ansi",
]
taffy = [
  "taffy/flexbox",
  "taffy/grid",
  "taffy/block_layout",
  "taffy/taffy_tree",
  "taffy/std",
]
tokio = ["tokio/rt-multi-thread", "tokio/macros", "tokio/sync", "tokio/time"]
toml = ["toml/serde", "toml/parse"]

[dependencies]
anyhow = { workspace = true }
async-task = { workspace = true }
bitflags = { workspace = true }
crossterm = { workspace = true }
derive_more = { workspace = true }
futures-util = { workspace = true }
inventory = { workspace = true }
parking_lot = { workspace = true }
ropey = { workspace = true }
rustc-hash = { workspace = true }
slotmap = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
taffy = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

dene_macros = { workspace = true }

[workspace]
resolver = "3"
members = ["dene_macros"]

[workspace.package]
version = "0.1.0"
authors = ["alibek <freed.alibek@gmail.com>"]
edition = "2024"
rust-version = "1.94.0"
description = "powerful and blazingly fast terminal user interface library."
readme = "README.md"
homepage = "https://codeberg.org/lolp1ke/dene"
repository = "https://codeberg.org/lolp1ke/dene"
license = "Apache-2.0"
keywords = ["tui", "terminal"]
categories = ["command-line-interface", "gui"]
exclude = ["*.log"]
include = ["LICENSE-APACHE", "**/*.rs", "Cargo.toml"]
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
async-task = { version = "4.7.1", default-features = false }
bitflags = { version = "2.13.1", default-features = false }
crossterm = { version = "0.29.0", default-features = false }
derive_more = { version = "2.1.1", default-features = false }
futures-util = { version = "0.3.33", default-features = false }
inventory = { version = "0.3.24", default-features = false }
parking_lot = { version = "0.12.5", default-features = false }
ropey = { version = "1.6.1", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }
slotmap = { version = "1.1.1", default-features = false }
smallvec = { version = "1.15.2", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
taffy = { version = "0.12.2", default-features = false }
tokio = { version = "1.53.1", default-features = false }
toml = { version = "1.1.4", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-width = { version = "0.2.2", default-features = false, features = ["no_std"] }

dene_macros = { path = "dene_macros" }

[[example]]
name = "hello_world"

[[example]]
name = "table"
