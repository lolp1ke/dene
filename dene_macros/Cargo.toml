[package]
name = "dene_macros"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
include.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[features]
default = ["syn"]

syn = ["syn/parsing", "syn/proc-macro", "syn/derive", "syn/printing", "syn/clone-impls"]

[dependencies]
syn = { version = "3.0.5", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
